name: Build, Security Scan, and Deploy

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      PROJECT_NAME: ${{ github.event.repository.name }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect current commit SHA
        run: |
          CURRENT_COMMIT_SHA=$(git rev-parse HEAD)
          echo "COMMIT_SHA=$CURRENT_COMMIT_SHA" >> "$GITHUB_ENV"

      - name: Run GitLeaks secret scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --verbose

      - name: Run Semgrep SAST scan
        run: |
          docker run --rm -v "$PWD:/src" returntocorp/semgrep:latest semgrep scan --config auto /src

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Prepare Dockerfile when missing
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "Using repository Dockerfile."
            echo "path=Dockerfile" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "No Dockerfile found. Creating fallback Dockerfile."
          echo "path=Dockerfile" >> "$GITHUB_OUTPUT"
          if [ -f package.json ]; then
            cat > Dockerfile <<'EOF'
          FROM node:20-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm install
          COPY . .
          CMD ["npm", "start"]
          EOF
          elif [ -f requirements.txt ]; then
            cat > Dockerfile <<'EOF'
          FROM python:3.12-alpine
          WORKDIR /app
          COPY requirements.txt ./
          RUN pip install --no-cache-dir -r requirements.txt
          COPY . .
          CMD ["python", "app.py"]
          EOF
          else
            cat > Dockerfile <<'EOF'
          FROM alpine:3.20
          WORKDIR /app
          COPY . .
          CMD ["sh", "-c", "ls -la /app"]
          EOF
          fi

      - name: Build Docker image
        id: image_build
        run: |
          IMAGE_NAMESPACE="${DOCKERHUB_USERNAME:-$REPOSITORY_OWNER}"
          IMAGE_REPO=$(echo "$IMAGE_NAMESPACE/$PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
          SHORT_COMMIT_SHA="${COMMIT_SHA:0:8}"
          IMAGE_SHA_REF="$IMAGE_REPO:$SHORT_COMMIT_SHA"
          IMAGE_LATEST_REF="$IMAGE_REPO:latest"

          docker build -f "${{ steps.dockerfile.outputs.path }}" -t "$IMAGE_SHA_REF" -t "$IMAGE_LATEST_REF" .

          echo "image_ref=$IMAGE_SHA_REF" >> "$GITHUB_OUTPUT"
          echo "latest_ref=$IMAGE_LATEST_REF" >> "$GITHUB_OUTPUT"

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image_build.outputs.image_ref }}
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker push "${{ steps.image_build.outputs.image_ref }}"
          docker push "${{ steps.image_build.outputs.latest_ref }}"
          echo "Pushed to Docker Hub successfully!"
